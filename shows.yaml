# One entry per show, keyed by an id: for a show synced from an external
# source (e.g. an edfringe.com CSV export, via scripts/sync-csv.ts), the id
# matches the "/whats-on/" part of its URL there; for a show you add by
# hand (e.g. a free-fringe listing), choose your own id. This file is the
# app's only source of show data - it doesn't read any external source
# itself.
#
# Two kinds of field, both optional:
#
#   title, venue, duration, startTime, url:
#     Every show has these (except startTime - see below). For a show synced
#     from an external source, the relevant sync script (e.g. `npm run
#     sync-csv`) fills them in and overwrites them wholesale on every run -
#     don't hand-edit them for a synced show. For a show with no sync
#     script (added by hand, or scraped by a script that doesn't own these
#     fields, e.g. fetch-free-fringe.ts), give all of them that apply.
#       title:     the show's name.
#       venue:     free text.
#       duration:  "H:MM", e.g. "1:15".
#       startTime: "HH:MM" - omit entirely if the show's start time changes
#                  by performance (add per-date times for it below).
#       url:       link to the show's page.
#
#   rating, dates, booked, bookedTime, times, noAvailability:
#     Hand-written notes for any show. A show with none of them is reported
#     as needing info on the #problems page.
#       rating: 0, 1, or 2 - higher = more interested. "?" counts as not
#               having a rating yet, same as leaving it out (both are treated as 0).
#               Booked shows always come first when sorting by rating.
#       dates:  the day-of-month numbers the show is on, e.g. [9, 10, 11].
#       booked: a single day-of-month number - use instead of "dates" once
#               you've booked a ticket; it replaces "dates" as the show's
#               only date.
#       bookedTime:
#               "HH:MM" - only needed when the booked date has more than one
#               performance (a "HH:MM-HH:MM" or "many" entry below for it),
#               to say which one you're booked for. Requires "booked".
#       times:  only needed when the show's start time varies by performance
#               (e.g. an edfringe.com CSV export says "Various times" for
#               it). A map of day-of-month number to a value for the dates
#               you know something about:
#                 "HH:MM"         one performance that day.
#                 "HH:MM-HH:MM"   two performances that day, at these times -
#                                 shown as two separate entries on the page.
#                 "many"          three or more performances that day - too
#                                 many to record specific times for.
#               Dates left out entirely are shown as "misc" with no
#               specific time.
#       noAvailability:
#               day-of-month numbers with no allocation remaining on the
#               show's source site (e.g. edfringe.com shows this as a red
#               bar under the date, captioned "No allocation remaining") -
#               shown in red on this page's date/time too. Filled in
#               automatically by fetch-dates.
#
# A "# PROBLEM: ..." comment directly above an entry means a sync script
# couldn't fully process that show - it's also shown as a warning on the
# #problems page. It's cleared automatically once whatever caused it is
# resolved, except for a show no longer present in its external source,
# which is never cleared automatically - delete the entry by hand once
# you're sure you don't want it any more.

