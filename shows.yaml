# One entry per show, keyed by an id: the part of its URL after
# "/whats-on/" for a show from my_fringe_favourites.csv, or one you choose
# yourself for a show that isn't in the CSV export (e.g. a free-fringe
# listing).
#
# Two kinds of field, both optional:
#
#   title, venue, duration, startTime, url:
#     Only needed for a show that isn't in the CSV export - give all five or
#     none.
#       title:     the show's name.
#       venue:     free text.
#       duration:  "H:MM", e.g. "1:15".
#       startTime: "HH:MM", or "varies" if the show's start time changes by
#                  performance (add per-date times for it below).
#       url:       link to the show's page.
#
#   rating, dates, booked, times, noAvailability:
#     Hand-written notes for any show. A show with none of them is reported
#     as needing info on the #problems page.
#       rating: 0, 1, or 2 - higher = more interested. "?" counts as not
#               having a rating yet, same as leaving it out (both are treated as 0).
#               Booked shows always come first when sorting by rating.
#       dates:  the day-of-month numbers the show is on, e.g. [9, 10, 11].
#       booked: a single day-of-month number - use instead of "dates" once
#               you've booked a ticket; it replaces "dates" as the show's
#               only date.
#       times:  only needed when the show's start time varies by performance
#               (my_fringe_favourites.csv says "Various times" for it). A map
#               of day-of-month number to a value for the dates you know
#               something about:
#                 "HH:MM"         one performance that day.
#                 "HH:MM-HH:MM"   two performances that day, at these times -
#                                 shown as two separate entries on the page.
#                 "many"          three or more performances that day - too
#                                 many to record specific times for.
#               Dates left out entirely are shown as "varies" with no
#               specific time.
#       noAvailability:
#               day-of-month numbers with no allocation remaining on
#               edfringe.com (shown there as a red bar under the date, with
#               a "No allocation remaining" caption) - shown in red on this
#               page's date/time too. Filled in automatically by fetch-dates.

