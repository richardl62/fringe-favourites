# Shows you want to track that aren't in the edfringe.com export (e.g. a
# free-fringe listing). One entry per show, keyed by an id you choose -
# use the same id to give it notes in show-notes.yaml.
#
# Fields (all required):
#   title:     the show's name.
#   venue:     free text.
#   duration:  "H:MM", e.g. "1:15".
#   startTime: "HH:MM", or "varies" if the show's start time changes by
#              performance (add per-date times for it in show-notes.yaml).
#   url:       link to the show's page.

example-non-fringe-show:
  title: "Example: A Free Fringe Show"
  venue: "Some Venue"
  duration: "1:00"
  startTime: "18:00"
  url: "https://example.org/shows/example-non-fringe-show"
  xxx: "fred"
